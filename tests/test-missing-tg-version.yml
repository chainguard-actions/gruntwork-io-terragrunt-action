name: Test missing tg_version fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in workspace
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - id: action
        uses: .
        continue-on-error: true
        with:
          # tg_version intentionally omitted — should fail with clear error
          tofu_version: '1.9.1'

      - name: Assert action failed due to missing tg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when tg_version is missing and no mise.toml"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
