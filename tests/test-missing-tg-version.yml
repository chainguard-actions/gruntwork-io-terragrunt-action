name: Test missing tg_version fails without mise.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - id: action
        uses: .
        continue-on-error: true
        with:
          tofu_version: "1.9.0"
          github_token: ${{ github.token }}
          # tg_version intentionally omitted to trigger validation error

      - name: Assert action failed due to missing tg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tg_version is missing and no mise.toml"
            exit 1
          fi
          echo "PASS: action correctly failed when tg_version is missing"
