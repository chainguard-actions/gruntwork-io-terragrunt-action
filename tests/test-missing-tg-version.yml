name: Test missing tg_version fails when no mise.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no mise.toml exists and tg_version is not provided, the action should fail
      - id: action
        uses: .
        continue-on-error: true
        # No tg_version, no tofu_version, no tf_path — should fail at validation step
        with:
          github_token: ${{ github.token }}

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tg_version is missing and no mise.toml, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tg_version is missing"
