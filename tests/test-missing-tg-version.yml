name: Test missing tg_version fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no mise.toml exists and tg_version is not provided, the action should fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          tofu_version: "1.9.0"
          github_token: ${{ github.token }}
          # tg_version intentionally omitted

      - name: Assert action failed due to missing tg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when tg_version is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when tg_version is missing"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
