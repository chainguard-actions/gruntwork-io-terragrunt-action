name: Test missing tofu_version fails without mise.toml and tf_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - id: action
        uses: .
        continue-on-error: true
        with:
          tg_version: "0.78.0"
          github_token: ${{ github.token }}
          # tofu_version intentionally omitted and no tf_path provided

      - name: Assert action failed due to missing tofu_version and tf_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tofu_version and tf_path are both missing"
            exit 1
          fi
          echo "PASS: action correctly failed when tofu_version and tf_path are both missing"
