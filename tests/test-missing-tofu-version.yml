name: Test missing tofu_version and tf_path fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no mise.toml exists and neither tofu_version nor tf_path is provided,
      # the action should fail with an error
      - id: action
        uses: .
        continue-on-error: true
        with:
          tg_version: "0.78.0"
          github_token: ${{ github.token }}
          # tofu_version intentionally omitted
          # tf_path intentionally omitted

      - name: Assert action failed due to missing tofu_version and tf_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when tofu_version and tf_path are both missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when tofu_version and tf_path are both missing"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
