name: Test missing tofu_version validation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          tg_version: "0.78.0"
          # tofu_version intentionally omitted, no tf_path provided, no mise.toml
        continue-on-error: true

      - name: Assert action failed due to missing tofu_version and tf_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tofu_version and tf_path are both missing and no mise.toml exists, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when tofu_version and tf_path were not provided"
