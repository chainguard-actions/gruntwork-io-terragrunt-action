name: Test missing tg_version fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no mise.toml exists and tg_version is not provided, the action should fail
      - id: action
        uses: .
        # No tg_version, no tofu_version, no tf_path, no mise.toml
        continue-on-error: true

      - name: Assert action failed due to missing tg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tg_version is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when tg_version was not provided"
