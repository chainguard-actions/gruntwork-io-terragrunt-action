name: Test terragrunt version command execution
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in working directory
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - name: Run action with --version command
        id: action
        uses: .
        with:
          tg_version: '0.77.22'
          tofu_version: '1.9.0'
          tg_command: '--version'
          tg_output_capture: '1'

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains version string
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: tg_action_output is empty"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qiE 'terragrunt|version'; then
            echo "FAIL: output does not contain 'terragrunt' or 'version'"
            exit 1
          fi
          echo "PASS: output contains version information"
