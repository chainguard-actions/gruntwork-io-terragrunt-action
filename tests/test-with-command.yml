name: Test with tg_command and tg_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tg_version: "0.67.16"
          tofu_version: "1.9.0"
          tg_command: "--version"
          tg_dir: "."
          github_token: ${{ github.token }}
          tg_output_capture: "1"
      - name: Assert exit code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit code is 0"
      - name: Assert tg_action_output is set
        env:
          TG_OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "tg_action_output: $TG_OUTPUT"
          if [ -z "$TG_OUTPUT" ]; then
            echo "FAIL: tg_action_output is empty"
            exit 1
          fi
          echo "PASS: tg_action_output is non-empty"
