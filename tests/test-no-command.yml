name: Test no tg_command skips execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tg_version: "0.77.22"
          tofu_version: "1.9.1"
          github_token: ${{ github.token }}
      - name: Assert terragrunt is installed
        run: |
          if ! command -v terragrunt &>/dev/null; then
            echo "FAIL: terragrunt not found in PATH"
            exit 1
          fi
          echo "PASS: terragrunt is installed at $(which terragrunt)"
      - name: Assert exit code output is empty (no command ran)
        env:
          ACTUAL: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "actual exit code output: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty tg_action_exit_code when no command is given, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: no exit code output when tg_command is not set"
