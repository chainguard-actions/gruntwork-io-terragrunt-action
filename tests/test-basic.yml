name: Test basic install (tg_version + tofu_version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tg_version: "0.67.16"
          tofu_version: "1.9.0"
          github_token: ${{ github.token }}
      - name: Assert terragrunt is installed
        run: |
          if ! command -v terragrunt &>/dev/null; then
            echo "FAIL: terragrunt not found in PATH"
            exit 1
          fi
          echo "PASS: terragrunt is installed"
          terragrunt --version
      - name: Assert tofu is installed
        run: |
          if ! command -v tofu &>/dev/null; then
            echo "FAIL: tofu not found in PATH"
            exit 1
          fi
          echo "PASS: tofu is installed"
          tofu --version
