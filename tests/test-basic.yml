name: Test basic usage with tg_version and tofu_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal terragrunt config
        run: |
          mkdir -p /tmp/tg-test
          cat > /tmp/tg-test/terragrunt.hcl <<'EOF'
          skip = true
          EOF

      - id: action
        uses: .
        with:
          tg_version: "0.69.10"
          tofu_version: "1.9.1"
          tg_command: "version"
          tg_dir: "/tmp/tg-test"
          github_token: ${{ github.token }}

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS"

      - name: Assert output contains version
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          echo "PASS"
