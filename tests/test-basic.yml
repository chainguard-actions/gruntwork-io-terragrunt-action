name: Test basic tool installation (tg_version + tofu_version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tg_version: "0.67.16"
          tofu_version: "1.9.0"
      - name: Assert terragrunt is installed
        run: |
          which terragrunt || { echo "FAIL: terragrunt not found in PATH"; exit 1; }
          terragrunt --version
          echo "PASS: terragrunt installed successfully"
      - name: Assert tofu is installed
        run: |
          which tofu || { echo "FAIL: tofu not found in PATH"; exit 1; }
          tofu --version
          echo "PASS: tofu installed successfully"
