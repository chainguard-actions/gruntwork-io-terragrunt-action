name: Test tf_path input instead of tofu_version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in workspace
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - name: Create a fake terraform binary for tf_path
        run: |
          mkdir -p /tmp/fake-tf-bin
          cat > /tmp/fake-tf-bin/terraform << 'EOF'
          #!/bin/sh
          echo "Terraform v1.9.0"
          exit 0
          EOF
          chmod +x /tmp/fake-tf-bin/terraform
          echo "Fake terraform binary created at /tmp/fake-tf-bin/terraform"

      - id: action
        uses: .
        with:
          tg_version: '0.77.22'
          tf_path: '/tmp/fake-tf-bin/terraform'
          tg_command: '--version'
          github_token: ${{ github.token }}

      - name: Assert action succeeded with tf_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded using tf_path instead of tofu_version"
          else
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi
