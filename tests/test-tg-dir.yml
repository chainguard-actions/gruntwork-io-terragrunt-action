name: Test tg_dir input for specifying execution directory
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in working directory
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - name: Create a subdirectory for tg_dir test
        run: |
          mkdir -p /tmp/tg-test-dir
          echo "Created /tmp/tg-test-dir"

      - name: Run action with tg_dir input
        id: action
        uses: .
        with:
          tg_version: '0.78.0'
          tofu_version: '1.9.1'
          tg_command: '--version'
          tg_dir: '/tmp/tg-test-dir'

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains version string
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: tg_action_output is empty"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qiE 'terragrunt|version'; then
            echo "FAIL: output does not contain 'terragrunt' or 'version'"
            exit 1
          fi
          echo "PASS: output contains version information"
