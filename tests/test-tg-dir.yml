name: Test tg_dir input - run terragrunt in a specific directory
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as tg_dir
        run: |
          mkdir -p /tmp/tg-test-dir
          echo "Created /tmp/tg-test-dir"

      - name: Run action with tg_dir set to a subdirectory
        id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tofu_version: "1.9.1"
          tg_command: "--version"
          tg_dir: "/tmp/tg-test-dir"
          tg_output_capture: "1"

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains terragrunt version
        env:
          ACTUAL: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qiE 'terragrunt|version'; then
            echo "FAIL: expected output to contain 'terragrunt' or 'version'"
            exit 1
          fi
          echo "PASS: output contains version information"
