name: Test output capture disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tofu_version: "1.9.0"
          tg_command: "--version"
          tg_output_capture: "0"
          github_token: ${{ github.token }}

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert tg_action_output is empty when capture disabled
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: '$OUTPUT'"
          if [ -n "$OUTPUT" ]; then
            echo "FAIL: expected empty output when tg_output_capture=0, got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: output is empty as expected when capture is disabled"
