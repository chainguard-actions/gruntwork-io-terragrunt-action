name: Test missing tg_version error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in working directory
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - name: Run action without tg_version (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          tg_command: ''

      - name: Assert action failed due to missing tg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tg_version is missing and no mise.toml exists"
            exit 1
          fi
          echo "PASS: action correctly failed when tg_version was not provided"
