name: Test tg_comment_url input for comment posting
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in working directory
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      # Run terragrunt with tg_comment=1 and a tg_comment_url set.
      # The comment posting may fail because the sentinel repo does not exist on GitHub,
      # but we verify the action ran and produced output regardless.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tg_version: '0.78.0'
          tofu_version: '1.9.1'
          tg_command: '--version'
          tg_comment: '1'
          tg_comment_url: ${{ github.api_url }}/repos/${{ github.repository }}/issues/1/comments

      - name: Assert action ran (output set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
          TG_OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          echo "tg_output: $TG_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify it actually ran terragrunt
            if ! echo "$TG_OUTPUT" | grep -qiE 'terragrunt|version'; then
              echo "FAIL: action succeeded but output does not contain version info"
              exit 1
            fi
            echo "PASS: action succeeded and output contains version information"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for comment posting)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
