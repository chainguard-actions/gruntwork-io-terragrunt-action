name: Test tg_comment_url input for comment posting
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no mise.toml exists in working directory
        run: |
          rm -f mise.toml .mise.toml
          echo "No mise.toml present"

      - name: Run action with tg_comment_url input
        id: action
        uses: .
        continue-on-error: true
        with:
          tg_version: '0.78.0'
          tofu_version: '1.9.1'
          tg_command: '--version'
          tg_comment: '1'
          tg_comment_url: 'https://api.github.com/repos/example/repo/issues/1/comments'

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded - verify terragrunt ran and produced output
            if [ -z "$OUTPUT" ]; then
              echo "FAIL: action succeeded but tg_action_output is empty"
              exit 1
            fi
            if ! echo "$OUTPUT" | grep -qiE 'terragrunt|version'; then
              echo "FAIL: output does not contain 'terragrunt' or 'version'"
              exit 1
            fi
            echo "PASS: action succeeded with tg_comment_url input"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action may fail if comment posting fails (e.g. sentinel repo or bad URL)
            # This is acceptable - the input was still passed and processed
            echo "PASS: action failed gracefully (comment posting may have failed on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
