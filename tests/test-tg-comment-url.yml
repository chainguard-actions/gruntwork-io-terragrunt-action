name: Test tg_comment_url input - pass comment URL for output posting
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with tg_comment_url provided
        id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tofu_version: "1.9.1"
          tg_command: "--version"
          tg_output_capture: "1"
          # tg_comment is left at default (0) so no actual API call is made,
          # but tg_comment_url is still passed to exercise the input
          tg_comment: "0"
          tg_comment_url: "https://api.github.com/repos/gruntwork-io/terragrunt-action/issues/1/comments"

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains terragrunt version
        env:
          ACTUAL: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qiE 'terragrunt|version'; then
            echo "FAIL: expected output to contain 'terragrunt' or 'version'"
            exit 1
          fi
          echo "PASS: output contains version information"
