name: Test using mise.toml for tool versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a mise.toml file in the workspace root so the action uses it for tool versions
      - name: Create mise.toml with tool versions
        run: |
          printf '[tools]\nterragrunt = "0.78.0"\nopentofu = "1.9.0"\n' > "$GITHUB_WORKSPACE/mise.toml"

      - id: action
        uses: .
        with:
          tg_command: "--version"
          github_token: ${{ github.token }}
          # tg_version and tofu_version intentionally omitted — mise.toml provides them

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains version info
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qi "terragrunt"; then
            echo "FAIL: expected output to contain 'terragrunt'"
            exit 1
          fi
          echo "PASS: output contains version info"

      - name: Cleanup mise.toml
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/mise.toml"
