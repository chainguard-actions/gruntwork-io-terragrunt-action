name: Test tf_path bypasses tofu_version requirement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install terraform manually so we have a tf binary to reference
      - name: Install terraform for tf_path test
        run: |
          # Use a pre-installed terraform or install a minimal one
          # We'll use tofu as the tf binary since it's compatible
          curl -sfL https://github.com/opentofu/opentofu/releases/download/v1.9.1/tofu_1.9.1_linux_amd64.zip \
            -o /tmp/tofu.zip
          unzip -o /tmp/tofu.zip -d /tmp/tofu-bin
          chmod +x /tmp/tofu-bin/tofu
          echo "TF_BIN=/tmp/tofu-bin/tofu" >> $GITHUB_ENV

      # When tf_path is provided, tofu_version should not be required
      - id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tf_path: "/tmp/tofu-bin/tofu"
          tg_command: "--version"
          # tofu_version intentionally omitted since tf_path is provided

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS"

      - name: Assert output contains terragrunt version
        env:
          ACTUAL: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qi "terragrunt"; then
            echo "FAIL: expected output to contain 'terragrunt'"
            exit 1
          fi
          echo "PASS"
