name: Test with tf_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install tofu manually
        run: |
          curl -Lo /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.9.0/tofu_1.9.0_linux_amd64.tar.gz
          tar -xzf /tmp/tofu.tar.gz -C /tmp
          chmod +x /tmp/tofu
          echo "Tofu installed at /tmp/tofu"
          /tmp/tofu version
      - id: action
        uses: .
        with:
          tg_version: "0.68.0"
          tf_path: "/tmp/tofu"
          tg_command: "version"
          tg_dir: "."
          github_token: ${{ github.token }}
      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
