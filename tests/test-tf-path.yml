name: Test using tf_path instead of tofu_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install opentofu directly via binary download to get a real binary path
      - name: Install opentofu binary
        id: install-tofu
        run: |
          TOFU_VERSION="1.9.0"
          TOFU_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$TOFU_URL" -o /tmp/tofu.zip
          unzip -o /tmp/tofu.zip -d /tmp/tofu-extract
          cp /tmp/tofu-extract/tofu "$HOME/.local/bin/tofu"
          chmod +x "$HOME/.local/bin/tofu"
          TF_BIN="$HOME/.local/bin/tofu"
          echo "tf_bin=$TF_BIN" >> $GITHUB_OUTPUT
          echo "Found tf binary: $TF_BIN"
          "$TF_BIN" version

      # When tf_path is provided, tofu_version is not required
      - id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tf_path: ${{ steps.install-tofu.outputs.tf_bin }}
          tg_command: "--version"
          github_token: ${{ github.token }}

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit code is 0"

      - name: Assert output contains version info
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qi "terragrunt"; then
            echo "FAIL: expected output to contain 'terragrunt'"
            exit 1
          fi
          echo "PASS: output contains version info"
