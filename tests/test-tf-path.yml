name: Test using tf_path instead of tofu_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install a tofu binary to use as tf_path
        run: |
          # Install opentofu so we have a real binary to point tf_path at
          curl -sfL https://get.opentofu.org/install-opentofu.sh | sh -s -- --install-method deb
          which tofu
          echo "tofu_path=$(which tofu)" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          tg_version: "0.78.0"
          tf_path: ${{ env.tofu_path }}
          tg_command: "--version"
          github_token: ${{ github.token }}

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is non-empty
        env:
          OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          echo "PASS"
