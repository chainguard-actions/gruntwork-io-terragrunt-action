name: Test usage with tf_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OpenTofu manually
        run: |
          curl -fsSL https://get.opentofu.org/install-opentofu.sh | sh -s -- --install-method standalone --opentofu-version 1.9.1
          echo "TOFU_PATH=$(which tofu)" >> $GITHUB_ENV

      - name: Create a minimal terragrunt config
        run: |
          mkdir -p /tmp/tg-test-tfpath
          cat > /tmp/tg-test-tfpath/terragrunt.hcl <<'EOF'
          skip = true
          EOF

      - id: action
        uses: .
        with:
          tg_version: "0.69.10"
          tf_path: ${{ env.TOFU_PATH }}
          tg_command: "version"
          tg_dir: "/tmp/tg-test-tfpath"
          github_token: ${{ github.token }}

      - name: Assert exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.tg_action_exit_code }}
        run: |
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS"
